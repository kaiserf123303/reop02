<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>互動式產品比較（單頁）</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans TC", Arial;
    }

    body {
      margin: 0;
      background: #f6f7fb;
      color: #111;
    }

    .wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px;
    }

    header {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 20px;
    }

    .hint {
      color: #555;
      font-size: 13px;
    }

    .panel {
      background: #fff;
      border: 1px solid #e8e8ef;
      border-radius: 12px;
      padding: 14px;
    }

    .filters {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 10px;
    }

    .filters label {
      display: block;
      font-size: 12px;
      color: #444;
      margin-bottom: 4px;
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid #ddd;
      outline: none;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: #999;
    }

    .grid {
      margin-top: 14px;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .card {
      background: #fff;
      border: 1px solid #e8e8ef;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .name {
      font-weight: 700;
    }

    .meta {
      font-size: 13px;
      color: #555;
    }

    .price {
      font-weight: 700;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      cursor: pointer;
      background: #111;
      color: #fff;
      font-weight: 600;
    }

    button.secondary {
      background: #eee;
      color: #111;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .compare {
      margin-top: 16px;
      display: grid;
      gap: 10px;
    }

    .compare-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      background: #fff;
      border: 1px solid #e8e8ef;
      border-radius: 999px;
      padding: 8px 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }

    .chip b {
      font-size: 13px;
    }

    .chip button {
      padding: 6px 8px;
      border-radius: 999px;
      font-size: 12px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border: 1px solid #e8e8ef;
      border-radius: 12px;
      overflow: hidden;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: left;
      font-size: 13px;
      vertical-align: top;
    }

    th {
      background: #fafafe;
      font-size: 12px;
      color: #444;
    }

    tr:last-child td {
      border-bottom: 0;
    }

    .empty {
      color: #666;
      font-size: 13px;
    }

    .badge {
      font-size: 12px;
      background: #f0f0ff;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid #e0e0ff;
    }

    @media (max-width: 900px) {
      .filters {
        grid-template-columns: 1fr 1fr;
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 560px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>互動式產品比較（單頁）</h1>
        <div class="hint">選 2–3 個商品加入比較；可用篩選器縮小範圍。</div>
      </div>
      <span class="badge" id="countBadge"></span>
    </header>

    <section class="panel" style="margin-top:12px;">
      <div class="filters">
        <div>
          <label>關鍵字</label>
          <input id="q" placeholder="輸入名稱 / 品牌…" />
        </div>
        <div>
          <label>品牌</label>
          <select id="brand">
            <option value="">全部</option>
          </select>
        </div>
        <div>
          <label>最低價格</label>
          <input id="minPrice" type="number" min="0" placeholder="0" />
        </div>
        <div>
          <label>最高價格</label>
          <input id="maxPrice" type="number" min="0" placeholder="99999" />
        </div>
      </div>
    </section>

    <section id="list" class="grid" aria-label="商品列表"></section>

    <section class="compare">
      <div class="compare-top">
        <div>
          <b>比較區（最多 3 個）</b>
          <div class="hint">點「移除」可從比較清單刪除。</div>
        </div>
        <button class="secondary" id="clearCompare">清空比較</button>
      </div>

      <div class="chips" id="chips"></div>
      <div id="compareTableWrap"></div>
    </section>
  </div>

  <script>
    // 1) 假資料（考試用：自己換成你要比的品類也行）
    const products = [
      { id: "p1", name: "Pro Controller X", brand: "Astra", price: 1890, specs: { type: "搖桿", weight: "260g", battery: "30h", connection: "BT/USB-C" } },
      { id: "p2", name: "ArcPad S", brand: "Astra", price: 1290, specs: { type: "搖桿", weight: "240g", battery: "20h", connection: "BT" } },
      { id: "p3", name: "Neo Grip 2", brand: "NOVA", price: 1590, specs: { type: "搖桿", weight: "255g", battery: "25h", connection: "2.4G/USB" } },
      { id: "p4", name: "Zen Controller", brand: "ZEN", price: 2190, specs: { type: "搖桿", weight: "270g", battery: "35h", connection: "BT/2.4G/USB-C" } },
      { id: "p5", name: "LitePad Mini", brand: "NOVA", price: 990, specs: { type: "搖桿", weight: "210g", battery: "15h", connection: "USB" } },
      { id: "p6", name: "Edge Controller", brand: "ZEN", price: 1790, specs: { type: "搖桿", weight: "265g", battery: "28h", connection: "BT/USB-C" } },
    ];

    // 2) 狀態
    const state = {
      q: "",
      brand: "",
      minPrice: "",
      maxPrice: "",
      compareIds: [], // 最多 3 個
    };

    // 3) DOM
    const elList = document.getElementById("list");
    const elChips = document.getElementById("chips");
    const elCompareTableWrap = document.getElementById("compareTableWrap");
    const elBrand = document.getElementById("brand");
    const elCountBadge = document.getElementById("countBadge");

    // 4) 初始化：品牌下拉
    function initBrandOptions() {
      const brands = [...new Set(products.map(p => p.brand))].sort();
      for (const b of brands) {
        const opt = document.createElement("option");
        opt.value = b;
        opt.textContent = b;
        elBrand.appendChild(opt);
      }
    }

    // 5) 篩選：回傳符合的商品
    function getFilteredProducts() {
      const q = state.q.trim().toLowerCase();
      const min = state.minPrice === "" ? null : Number(state.minPrice);
      const max = state.maxPrice === "" ? null : Number(state.maxPrice);

      return products.filter(p => {
        if (state.brand && p.brand !== state.brand) return false;

        if (q) {
          const hay = (p.name + " " + p.brand).toLowerCase();
          if (!hay.includes(q)) return false;
        }

        if (min !== null && p.price < min) return false;
        if (max !== null && p.price > max) return false;

        return true;
      });
    }

    // 6) 加入比較 / 移除比較
    function addToCompare(id) {
      if (state.compareIds.includes(id)) return;
      if (state.compareIds.length >= 3) {
        alert("最多只能比較 3 個商品");
        return;
      }
      state.compareIds.push(id);
      renderAll();
    }

    function removeFromCompare(id) {
      state.compareIds = state.compareIds.filter(x => x !== id);
      renderAll();
    }

    // 7) Render：商品列表
    function renderList() {
      const list = getFilteredProducts();
      elCountBadge.textContent = `顯示 ${list.length} / ${products.length}`;

      elList.innerHTML = "";
      if (list.length === 0) {
        elList.innerHTML = `<div class="panel empty" style="grid-column:1/-1;">沒有符合條件的商品</div>`;
        return;
      }

      for (const p of list) {
        const inCompare = state.compareIds.includes(p.id);
        const disabled = !inCompare && state.compareIds.length >= 3;

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="row">
            <div>
              <div class="name">${p.name}</div>
              <div class="meta">${p.brand} ・ ${p.specs.type}</div>
            </div>
            <div class="price">$${p.price.toLocaleString()}</div>
          </div>

          <div class="meta">
            重量：${p.specs.weight}　|　續航：${p.specs.battery}<br/>
            連線：${p.specs.connection}
          </div>

          <div class="row">
            <button ${inCompare ? "disabled" : ""} ${disabled ? "disabled" : ""} data-add="${p.id}">
              ${inCompare ? "已加入比較" : "加入比較"}
            </button>
            <button class="secondary" data-view="${p.id}">查看規格</button>
          </div>
        `;
        elList.appendChild(card);
      }

      // 綁定事件
      elList.querySelectorAll("[data-add]").forEach(btn => {
        btn.addEventListener("click", () => addToCompare(btn.dataset.add));
      });
      elList.querySelectorAll("[data-view]").forEach(btn => {
        btn.addEventListener("click", () => showSpecs(btn.dataset.view));
      });
    }

    // 8) Render：比較 chips + 表格
    function renderCompare() {
      const items = state.compareIds.map(id => products.find(p => p.id === id)).filter(Boolean);

      // chips
      elChips.innerHTML = "";
      if (items.length === 0) {
        elChips.innerHTML = `<div class="panel empty">尚未加入比較商品（建議至少選 2 個）</div>`;
      } else {
        for (const p of items) {
          const chip = document.createElement("div");
          chip.className = "chip";
          chip.innerHTML = `<b>${p.name}</b><span class="meta">($${p.price.toLocaleString()})</span>
            <button class="secondary" data-rm="${p.id}">移除</button>`;
          elChips.appendChild(chip);
        }
        elChips.querySelectorAll("[data-rm]").forEach(btn => {
          btn.addEventListener("click", () => removeFromCompare(btn.dataset.rm));
        });
      }

      // 表格
      elCompareTableWrap.innerHTML = "";
      if (items.length < 2) {
        elCompareTableWrap.innerHTML = `<div class="panel empty">比較表需至少 2 個商品才會顯示。</div>`;
        return;
      }

      // 收集所有 specs key（避免不同商品規格不一致）
      const keys = new Set(["brand", "price"]);
      items.forEach(p => Object.keys(p.specs).forEach(k => keys.add(k)));

      const rows = [];
      for (const k of keys) {
        const label = k === "brand" ? "品牌"
          : k === "price" ? "價格"
            : k === "type" ? "類型"
              : k === "weight" ? "重量"
                : k === "battery" ? "續航"
                  : k === "connection" ? "連線"
                    : k;

        const tds = items.map(p => {
          if (k === "brand") return `<td>${p.brand}</td>`;
          if (k === "price") return `<td>$${p.price.toLocaleString()}</td>`;
          return `<td>${p.specs[k] ?? "—"}</td>`;
        }).join("");

        rows.push(`<tr><th>${label}</th>${tds}</tr>`);
      }

      const head = `<tr><th>項目</th>${items.map(p => `<th>${p.name}</th>`).join("")}</tr>`;
      elCompareTableWrap.innerHTML = `
        <table aria-label="比較表">
          <thead>${head}</thead>
          <tbody>${rows.join("")}</tbody>
        </table>
      `;
    }

    // 9) 小加分：規格查看（用 alert 模擬，考試可改成 modal）
    function showSpecs(id) {
      const p = products.find(x => x.id === id);
      if (!p) return;
      const lines = Object.entries(p.specs).map(([k, v]) => `${k}: ${v}`).join("\n");
      alert(`${p.name}\n品牌: ${p.brand}\n價格: $${p.price}\n\n${lines}`);
    }

    function renderAll() {
      renderList();
      renderCompare();
    }

    // 10) 綁定篩選事件
    document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value; renderAll(); });
    document.getElementById("brand").addEventListener("change", (e) => { state.brand = e.target.value; renderAll(); });
    document.getElementById("minPrice").addEventListener("input", (e) => { state.minPrice = e.target.value; renderAll(); });
    document.getElementById("maxPrice").addEventListener("input", (e) => { state.maxPrice = e.target.value; renderAll(); });

    document.getElementById("clearCompare").addEventListener("click", () => {
      state.compareIds = [];
      renderAll();
    });

    // init
    initBrandOptions();
    renderAll();
  </script>
</body>

</html>
