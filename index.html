<!doctype html>
<html lang="zh-Hant">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>互動式產品比較（單頁）</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="wrap">
    <header class="header">
      <div>
        <h1 class="title">互動式產品比較（單頁）</h1>
        <div class="hint">資料來源：PChome 24h（參考）；價格為參考價，僅供前端功能展示。</div>
      </div>
      <span class="badge" id="countBadge"></span>
    </header>

    <section class="panel" style="margin-top:12px;">

      <div class="filters">
        <div>
          <label>種類</label>
          <select id="category">
            <option value="">全部</option>
          </select>
        </div>

        <div>
          <label>關鍵字</label>
          <input id="q" placeholder="輸入名稱 / 品牌…" />
        </div>

        <div>
          <label>品牌</label>
          <select id="brand">
            <option value="">全部</option>
          </select>
        </div>

        <div>
          <label>最低價格</label>
          <input id="minPrice" type="number" min="0" placeholder="0" />
        </div>

        <div>
          <label>最高價格</label>
          <input id="maxPrice" type="number" min="0" placeholder="99999" />
        </div>

        <div>
          <label>排序</label>
          <select id="sort">
            <option value="default" selected>預設</option>
            <option value="priceAsc">價格 低→高</option>
            <option value="priceDesc">價格 高→低</option>
          </select>
        </div>
      </div>
    </section>

    <section id="list" class="grid" aria-label="商品列表"></section>

    <!-- ✅ 分頁：頁碼置中、頁數資訊靠右 -->
    <section class="pager panel" aria-label="分頁">
      <div class="pagerCenter">
        <div class="pageNums" id="pageNums" aria-label="頁碼"></div>
      </div>
      <div class="pagerRight">
        <span class="pagerInfo" id="pageInfo"></span>
      </div>
    </section>

    <section class="compare">
      <div class="compare-top">
        <div>
          <b>比較區（最多 3 個）</b>
          <div class="hint">點「移除」可從比較清單刪除；至少選 2 個才會顯示比較表。</div>
        </div>
        <button class="secondary" id="clearCompare">清空比較</button>
      </div>

      <div class="chips" id="chips"></div>
      <div id="compareTableWrap"></div>
    </section>
  </div>

  <!-- 你的 script.js 用原本那份（已修好 CATEGORIES 的） -->
  <script src="script.js"></script>
</body>

</html>
